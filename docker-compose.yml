services:
  postgres:
    image: postgres:16-alpine
    container_name: billing_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-billing_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billing_pass}
      POSTGRES_DB: ${POSTGRES_DB:-billing_ledger}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: billing_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3
    container_name: billing_localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: sns,sqs
      DEBUG: 0
      PERSISTENCE: 1
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/localstack-setup.sh:/etc/localstack/init/ready.d/setup.sh
    healthcheck:
      test: ["CMD-SHELL", "awslocal sns list-topics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ─── Servicos .NET (opcionais) ──────────────────────────────────────────────
  # Sobem apenas com: docker compose --profile app up -d --build
  # As migrations NAO sao aplicadas automaticamente: rode `dotnet ef database update`
  # (ver README) contra o Postgres do compose antes de subir este profile.
  billing-api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/BillingLedger.Billing.Api/Dockerfile
    container_name: billing_api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-billing_ledger};Username=${POSTGRES_USER:-billing_user};Password=${POSTGRES_PASSWORD:-billing_pass}
      Messaging__Transport: SQS
      Messaging__LocalStackServiceUrl: http://localstack:4566
      Messaging__BillingApiQueueName: billing-worker-queue
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-dev-signing-key-must-be-32-chars!!}
      Payments__WebhookSecret: ${PAYMENTS_WEBHOOK_SECRET:-test-secret}
    ports:
      - "5082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  payments-worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/BillingLedger.Payments.Worker/Dockerfile
    container_name: billing_payments_worker
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-billing_ledger};Username=${POSTGRES_USER:-billing_user};Password=${POSTGRES_PASSWORD:-billing_pass}
      Messaging__Transport: SQS
      Messaging__LocalStackServiceUrl: http://localstack:4566
      Messaging__QueueName: payments-worker-queue
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  ledger-worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/BillingLedger.Ledger.Worker/Dockerfile
    container_name: billing_ledger_worker
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-billing_ledger};Username=${POSTGRES_USER:-billing_user};Password=${POSTGRES_PASSWORD:-billing_pass}
      Messaging__Transport: SQS
      Messaging__LocalStackServiceUrl: http://localstack:4566
      Messaging__InvoiceIssuedQueueName: ledger-worker-queue
      Messaging__InvoicePaidQueueName: ledger-worker-queue
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

volumes:
  postgres_data:
  localstack_data:
